[project]
name = "kasalix-backend"
version = "0.11.0"
description = "Kasalix AI Chat backend (Python port of the TypeScript/Hono backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "cryptography>=43",
    "argon2-cffi>=23",
    "resvg-py>=0.4",
    "ddgs>=9.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# PyInstaller spec lives in build/backend.spec
